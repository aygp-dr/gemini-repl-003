name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - '*.org'
      - '*.md'

jobs:
  check-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        folder-path: 'docs'
    
    - name: Spell check
      uses: streetsidesoftware/cspell-action@v2
      with:
        files: |
          **/*.md
          **/*.org
